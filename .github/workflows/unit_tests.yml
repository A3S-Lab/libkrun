name: Unit tests
on: [pull_request]

jobs:
  unit-tests-linux-x86_64:
    name: Unit tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm $USER

      - name: Unit tests
        run: cargo test --workspace --exclude libkrunfw-windows --exclude a3s-libkrun-sys

  unit-tests-linux-aarch64:
    name: Unit tests (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Create a fake init
        run: touch init/init

      - name: Check KVM availability
        id: kvm
        run: |
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ARM64 VMM unit tests will be compiled but not executed because this hosted runner does not expose /dev/kvm."
            {
              echo "### ARM64 VMM unit execution skipped"
              echo
              echo "The hosted runner does not expose a readable and writable /dev/kvm device."
              echo "All non-VMM unit tests run normally, and the VMM unit-test target is still compiled."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests (non-VMM)
        run: cargo test --workspace --exclude libkrunfw-windows --exclude a3s-libkrun-sys --exclude vmm

      - name: VMM unit tests
        if: steps.kvm.outputs.available == 'true'
        run: cargo test -p vmm

      - name: Compile VMM unit tests without KVM
        if: steps.kvm.outputs.available != 'true'
        run: cargo test -p vmm --no-run
