name: Backpressure diagnostic

on:
  push:
    branches:
      - codex/backpressure-ci-20260805

permissions:
  contents: read

jobs:
  backpressure:
    name: Backpressure (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - name: Run focused backpressure tests
        shell: bash
        run: |
          set +e
          cargo test --locked -p devices --features net backpressure -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/backpressure.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            python3 - "$RUNNER_TEMP/backpressure.log" <<'PY'
          import pathlib
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          detail = "\n".join(log.splitlines()[-120:])[-16000:]
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Focused libkrun backpressure test failed::{detail}")
          PY
          fi
          exit "$test_status"
