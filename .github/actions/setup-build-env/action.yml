name: 'Setup Build Environment'
description: 'Common setup for Rust builds with all required packages (Linux & macOS)'
runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup update stable
        rustup default stable
        rustup component add rustfmt clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Set up Homebrew (macOS)
      if: runner.os == 'macOS'
      # Composite actions resolve every uses: entry before step ifs run, so a
      # floating @master pin breaks Linux CI even though this step is macOS-only.
      uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Modern Homebrew refuses untrusted third-party formulas during `tap`,
        # so allow the clone to land, trust the tap, then install.
        brew tap slp/krun || true
        brew trust slp/krun
        brew install virglrenderer clang-format llvm

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libvirglrenderer-dev \
          libepoxy-dev \
          libdrm-dev \
          libpipewire-0.3-dev \
          clang-format \
          libclang-dev
